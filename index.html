<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BedrockPro | Ekonomi & Telefon Modu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #07080c; --card: rgba(18, 20, 32, 0.85); --border: rgba(255, 255, 255, 0.1);
            --accent: #ff334b; --accent-glow: rgba(255, 51, 75, 0.5); --success: #00ff88; --text: #ffffff; --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg); color: var(--text); min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            background-image: radial-gradient(circle at 50% -20%, rgba(255, 51, 75, 0.25) 0%, transparent 60%);
        }
        .container {
            width: 100%; max-width: 480px; background: var(--card); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 32px; padding: 35px 25px; text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }
        .hero-icon {
            width: 80px; height: 80px; background: linear-gradient(135deg, #ff334b, #ff6b81);
            border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 36px;
            color: #fff; margin: 0 auto 20px auto; box-shadow: 0 15px 35px var(--accent-glow);
        }
        h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
        p { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
        .btn-download {
            background: linear-gradient(135deg, #ff334b, #e8142a); color: #fff; border: none; width: 100%;
            padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 30px var(--accent-glow);
        }
        .btn-download:active { transform: scale(0.97); }
        #status { margin-top: 15px; font-size: 13px; color: var(--success); font-weight: 700; min-height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero-icon"><i class="fa-solid fa-wallet"></i></div>
        <h1>Ekonomi & Telefon Modu</h1>
        <p>Toprak kazarak para kazan, küreğini geliştir ve akıllı telefonla arkadaşlarına para gönder!</p>

        <button class="btn-download" onclick="downloadAddon()">
            <i class="fa-solid fa-cloud-arrow-down"></i> Paketi İndir (.mcaddon)
        </button>
        <div id="status"></div>
    </div>

    <script>
        function downloadAddon() {
            const status = document.getElementById('status');

            if (typeof JSZip === 'undefined') {
                status.style.color = "#ff334b";
                status.innerText = "Hata: İnternet bağlantını kontrol et, kütüphane yüklenemedi!";
                return;
            }

            if (navigator.vibrate) navigator.vibrate(30);
            status.style.color = "#00ff88";
            status.innerText = "Paket hazırlanıyor...";

            const zip = new JSZip();

            const manifest = {
                "format_version": 2,
                "header": {
                    "name": "BedrockPro Ekonomi & Telefon",
                    "description": "Telefonla para gonderme ve kurekle toprak kazarak zenginlesme modu!",
                    "uuid": "f81d4fae-7dec-11d0-a765-00a0c91e6bf6",
                    "version": [2, 5, 0],
                    "min_engine_version": [1, 21, 0]
                },
                "modules": [
                    { "type": "data", "uuid": "a2b3c4d5-e6f7-8901-2345-6789abcdef01", "version": [1, 0, 0] },
                    { "type": "script", "language": "javascript", "uuid": "c3d4e5f6-7890-abcd-ef12-34567890abcd", "version": [1, 0, 0], "entry": "scripts/main.js" }
                ],
                "dependencies": [
                    { "module_name": "@minecraft/server", "version": "1.13.0" },
                    { "module_name": "@minecraft/server-ui", "version": "1.2.0" }
                ]
            };

            const mainJs = `
import { world, system } from "@minecraft/server";
import { ActionFormData, ModalFormData } from "@minecraft/server-ui";

world.afterEvents.playerSpawn.subscribe((event) => {
    let player = event.player;
    try {
        let objective = world.scoreboard.getObjective("para") || world.scoreboard.addObjective("para", "Cuzdan");
        if (!objective.hasParticipant(player)) { objective.setScore(player, 100); }
    } catch (e) {}
});

world.afterEvents.playerBreakBlock.subscribe((event) => {
    let player = event.player;
    let block = event.brokenBlockPermutation;
    if (block.type.id.includes("dirt") || block.type.id.includes("grass")) {
        let equipment = player.getComponent("equippable");
        let mainhand = equipment ? equipment.getEquipment("Mainhand") : null;
        let minReward = 2, maxReward = 5, shovelName = "Elinle Kazdin";
        if (mainhand) {
            let item = mainhand.typeId;
            if (item.includes("wooden_shovel")) { minReward = 8; maxReward = 13; shovelName = "Tahta Kurek"; }
            else if (item.includes("stone_shovel")) { minReward = 18; maxReward = 28; shovelName = "Tas Kurek"; }
            else if (item.includes("iron_shovel")) { minReward = 40; maxReward = 65; shovelName = "Demir Kurek"; }
            else if (item.includes("diamond_shovel")) { minReward = 90; maxReward = 140; shovelName = "Elmas Kurek"; }
            else if (item.includes("netherite_shovel")) { minReward = 180; maxReward = 280; shovelName = "Netherite Kurek"; }
        }
        let earned = Math.floor(Math.random() * (maxReward - minReward + 1)) + minReward;
        let objective = world.scoreboard.getObjective("para");
        if (objective) {
            let current = objective.getScore(player) || 0;
            objective.setScore(player, current + earned);
            player.sendMessage("§a[Ekonomi] §e+" + earned + " Para Kazandin! §7(" + shovelName + ")");
        }
    }
});

world.afterEvents.itemUse.subscribe((event) => {
    let player = event.source;
    if (event.itemStack.typeId === "minecraft:clock") { openPhoneMenu(player); }
});

world.afterEvents.chatSend.subscribe((event) => {
    let player = event.sender;
    if (event.message === "!telefon" || event.message === "!phone") {
        event.cancel = true;
        system.run(() => { openPhoneMenu(player); });
    }
});

function openPhoneMenu(player) {
    let objective = world.scoreboard.getObjective("para");
    let balance = objective ? (objective.getScore(player) || 0) : 0;
    let form = new ActionFormData()
        .title("📱 BedrockCell Telefon")
        .body("Hos Geldin, " + player.name + "!\\nCuzdan Bakiyen: " + balance + " Para")
        .button("💰 Arkadasina Para Gonder")
        .button("📊 Zenginler Listesi")
        .button("❌ Kapat");
    form.show(player).then((response) => {
        if (response.selection === 0) openTransferMenu(player);
        else if (response.selection === 1) showLeaderboard(player);
    });
}

function openTransferMenu(player) {
    let players = world.getAllPlayers().filter(p => p.name !== player.name);
    if (players.length === 0) { player.sendMessage("§cSunucuda baska aktif oyuncu yok!"); return; }
    let playerNames = players.map(p => p.name);
    let form = new ModalFormData()
        .title("💸 Para Transferi")
        .dropdown("Gonderilecek Kisi:", playerNames)
        .textField("Gonderilecek Miktar:", "Ornek: 50");
    form.show(player).then((response) => {
        if (!response.formValues) return;
        let targetName = playerNames[response.formValues[0]];
        let amount = parseInt(response.formValues[1]);
        let targetPlayer = players.find(p => p.name === targetName);
        if (isNaN(amount) || amount <= 0) return;
        let objective = world.scoreboard.getObjective("para");
        let senderBalance = objective.getScore(player) || 0;
        if (senderBalance < amount) { player.sendMessage("§cYeterli paran yok!"); return; }
        objective.setScore(player, senderBalance - amount);
        let targetBalance = objective.getScore(targetPlayer) || 0;
        objective.setScore(targetPlayer, targetBalance + amount);
        player.sendMessage("§a[Telefon] §e" + targetName + " §7adli oyuncuya §a" + amount + " para §7gonderdin!");
        targetPlayer.sendMessage("§a[Telefon] §e" + player.name + " §7sana §a" + amount + " para §7gonderdi!");
    });
}

function showLeaderboard(player) {
    let objective = world.scoreboard.getObjective("para");
    let players = world.getAllPlayers();
    let scores = players.map(p => ({
        name: p.name,
        score: objective ? (objective.getScore(p) || 0) : 0
    })).sort((a, b) => b.score - a.score);
    let text = "🏆 Sunucu Zenginleri:\\n\\n";
    scores.forEach((s, index) => { text += "#" + (index + 1) + " " + s.name + " - " + s.score + " Para\\n"; });
    let form = new ActionFormData().title("📊 Ekonomi Sıralaması").body(text).button("Geri Don");
    form.show(player).then(() => { openPhoneMenu(player); });
}
            `;

            zip.file("manifest.json", JSON.stringify(manifest, null, 2));
            zip.file("scripts/main.js", mainJs);

            zip.generateAsync({ type: "blob" }).then(function (content) {
                const blob = new Blob([content], { type: "application/zip" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "BedrockPro_EkonomiTelefon_v2.5.mcaddon";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                status.innerText = "İndirme tamamlandı! Minecraft'ta açabilirsiniz.";
            }).catch(err => {
                status.style.color = "#ff334b";
                status.innerText = "Hata oluştu: " + err;
            });
        }
    </script>
</body>
</html>
